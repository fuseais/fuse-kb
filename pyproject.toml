[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "fuse-kb"
version = "0.1.0"
description = "Search Fuse knowledge-base files (.sqlite) from your own agents and apps: hybrid keyword + vector search, reranking, agent tools, and an MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fuse" }]
keywords = ["rag", "retrieval", "sqlite", "sqlite-vec", "knowledge-base", "agents", "mcp", "hybrid-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
# Query embedders and rerankers. Install the one your KB was built with;
# `fuse-kb info <kb>` tells you which that is.
bedrock = ["boto3>=1.28"]
local = ["sentence-transformers>=2.2"]
openai = ["openai>=1.0"]
# LLMs for HyDE and grounded answers.
anthropic = ["anthropic>=1.0"]
# Model Context Protocol server (`fuse-kb mcp`).
mcp = ["mcp>=1.2"]
all = [
    "boto3>=1.28",
    "sentence-transformers>=2.2",
    "openai>=1.0",
    "anthropic>=1.0",
    "mcp>=1.2",
]
dev = ["pytest>=8"]

[project.scripts]
fuse-kb = "fuse_kb.cli:main"

[project.urls]
Homepage = "https://github.com/fuseais/fuse-kb"

[tool.hatch.build.targets.wheel]
packages = ["src/fuse_kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
